<?xml version="1.0" encoding="UTF-8"?>
<!--
  Early warning indicators across identity, endpoint, and people.
  Campus Ransomware Playbook · CrimRxiv Consortium · CC BY 4.0
  by Joshua Gerstenfeld and Scott Jacques.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img"
     aria-labelledby="ew-title ew-desc" font-family="Georgia, 'Times New Roman', serif">
  <title id="ew-title">Ransomware early warning indicators</title>
  <desc id="ew-desc">Three columns — Identity, Endpoint, and People — listing observable early-warning indicators that often precede ransomware encryption. When two or more co-occur, treat as a likely incident.</desc>
  <style>
    .bg { fill: #ffffff; }
    .col { fill: #fff; stroke: #d9d9d9; stroke-width: 1; }
    .head { fill: #f68212; }
    .head-text { fill: #fff; font-weight: 700; font-size: 14px; }
    .ink { fill: #111111; font-size: 13px; }
    .muted { fill: #555555; font-size: 11px; }
    .alert-bg { fill: #111111; }
    .alert-text { fill: #ffffff; font-weight: 700; font-size: 13px; }
  </style>

  <rect class="bg" width="900" height="320"/>

  <!-- column: identity -->
  <g>
    <rect class="col" x="20"  y="20" width="260" height="220" rx="10"/>
    <path class="head" d="M20 30 a10 10 0 0 1 10 -10 h240 a10 10 0 0 1 10 10 v40 h-260 z"/>
    <text class="head-text" x="150" y="55" text-anchor="middle">Identity</text>
    <text class="ink"  x="38"  y="100">• Impossible-travel sign-ins</text>
    <text class="ink"  x="38"  y="124">• MFA fatigue / push spam</text>
    <text class="ink"  x="38"  y="148">• Unexpected new OAuth grants</text>
    <text class="ink"  x="38"  y="172">• Inbox forwarding rules created</text>
    <text class="ink"  x="38"  y="196">• Failed-login bursts on service accts</text>
    <text class="muted" x="38" y="226">Source signal: IdP &amp; mail logs</text>
  </g>

  <!-- column: endpoint -->
  <g>
    <rect class="col" x="320" y="20" width="260" height="220" rx="10"/>
    <path class="head" d="M320 30 a10 10 0 0 1 10 -10 h240 a10 10 0 0 1 10 10 v40 h-260 z"/>
    <text class="head-text" x="450" y="55" text-anchor="middle">Endpoint</text>
    <text class="ink"  x="338" y="100">• Mass file renames / extensions</text>
    <text class="ink"  x="338" y="124">• Volume-shadow copy deletion</text>
    <text class="ink"  x="338" y="148">• Disabled antivirus / EDR tampering</text>
    <text class="ink"  x="338" y="172">• Living-off-the-land tooling spikes</text>
    <text class="ink"  x="338" y="196">• Outbound traffic to new C2 hosts</text>
    <text class="muted" x="338" y="226">Source signal: EDR &amp; firewall</text>
  </g>

  <!-- column: people -->
  <g>
    <rect class="col" x="620" y="20" width="260" height="220" rx="10"/>
    <path class="head" d="M620 30 a10 10 0 0 1 10 -10 h240 a10 10 0 0 1 10 10 v40 h-260 z"/>
    <text class="head-text" x="750" y="55" text-anchor="middle">People</text>
    <text class="ink"  x="638" y="100">• Targeted phishing (publishers, grants)</text>
    <text class="ink"  x="638" y="124">• Vendor banking-change requests</text>
    <text class="ink"  x="638" y="148">• Help-desk calls about “reset MFA”</text>
    <text class="ink"  x="638" y="172">• Reports of unfamiliar OAuth prompts</text>
    <text class="ink"  x="638" y="196">• Multiple users seeing the same lure</text>
    <text class="muted" x="638" y="226">Source signal: report-phish, help desk</text>
  </g>

  <!-- alert callout -->
  <rect class="alert-bg" x="40" y="262" width="820" height="40" rx="8"/>
  <text class="alert-text" x="450" y="287" text-anchor="middle">When two or more co-occur, published guidance treats them as a likely incident worth investigating</text>
</svg>
